# Hardware Pipeline CI/CD — kh
# Auto-generated by Hardware Pipeline v2
# Qt 5.14.2 | QMake | MinGW (Linux CI via GCC)

name: Hardware Pipeline CI

on:
  push:
    branches: [ main, master, 'ai/pipeline/**' ]
  pull_request:
    branches: [ main, master ]

env:
  QT_VERSION: '5.14.2'

jobs:
  # ------------------------------------------------------------------ #
  # Build Qt 5 application with QMake
  # ------------------------------------------------------------------ #
  build-qt-app:
    name: Build Qt Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Qt ${{ env.QT_VERSION }}
        uses: jurplel/install-qt-action@v3
        with:
          version: ${{ env.QT_VERSION }}
          modules: ''          # serialport is included in Qt 5.14.2 base

      - name: Run qmake
        working-directory: qt_gui
        run: qmake kh.pro CONFIG+=release

      - name: Build with make
        working-directory: qt_gui
        run: make -j$(nproc)

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: kh-linux
          path: qt_gui/kh
          retention-days: 30

  # ------------------------------------------------------------------ #
  # Static Analysis — Cppcheck (drivers + Qt GUI)
  # ------------------------------------------------------------------ #
  static-analysis:
    name: Static Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Cppcheck
        run: sudo apt-get install -y cppcheck

      - name: Run Cppcheck on C drivers
        run: |
          cppcheck \
            --enable=all \
            --std=c11 \
            --suppress=missingIncludeSystem \
            --error-exitcode=0 \
            --xml \
            --output-file=cppcheck-drivers.xml \
            drivers/ || true

      - name: Run Cppcheck on Qt GUI (C++14)
        run: |
          cppcheck \
            --enable=warning,style,performance,portability \
            --std=c++14 \
            --suppress=missingIncludeSystem \
            --error-exitcode=0 \
            qt_gui/

      - name: Upload Cppcheck report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cppcheck-report
          path: cppcheck-drivers.xml
          retention-days: 30

  # ------------------------------------------------------------------ #
  # Code Quality Gate
  # ------------------------------------------------------------------ #
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: [ build-qt-app, static-analysis ]

    steps:
      - name: Quality gate passed
        run: |
          echo "All quality checks passed for kh"
          echo "Qt version : 5.14.2 (QMake)"
          echo "Build      : OK"
          echo "Analysis   : Cppcheck OK"
          echo "Pipeline   : Hardware Pipeline v2"
